[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cosmolex-mcp"
version = "0.3.0"
description = "MCP server for CosmoLex: matters, clients, time, invoices and payments."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["cosmolex", "mcp", "legal", "law", "claude", "practice-management"]
classifiers = [
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.13,<3",
    "requests>=2.34.2",
    "keyring>=25.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
]

[project.scripts]
cosmolex-mcp = "cosmolex_mcp.server:main"
cosmolex-mcp-setup = "cosmolex_mcp.cli:setup_main"
cosmolex-mcp-verify = "cosmolex_mcp.cli:verify_main"

[project.urls]
Homepage = "https://github.com/RosenAdvertising/cosmolex-mcp"
Repository = "https://github.com/RosenAdvertising/cosmolex-mcp"
Issues = "https://github.com/RosenAdvertising/cosmolex-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["cosmolex_mcp"]

[tool.pyright]
include = ["."]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "venv", "dist", "build"]
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
